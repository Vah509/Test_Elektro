name: schedule-test

# ВРЕМЕННЫЙ тест: срабатывает ли cron в этом репозитории.
# Каждые 10 минут шлёт в Telegram одну строку. Тестов сайта не запускает.
# После проверки удалить файл .github/workflows/schedule-test.yml.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Отправить сообщение в Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          EVENT: ${{ github.event_name }}
        run: |
          KYIV=$(TZ=Europe/Kyiv date '+%d.%m %H:%M:%S')
          UTC=$(date -u '+%H:%M:%S')
          TEXT="⏰ schedule-test: сработал (${EVENT})
          Киев ${KYIV} · UTC ${UTC}"
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true" > /dev/null
